<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Luxury Product — Hero</title>
  <style>
    :root{
      --bg0:#05070b;
      --text:#e9eef7;
      --muted: rgba(233,238,247,.62);
      --stroke: rgba(255,255,255,.14);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      overflow:hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background: radial-gradient(1200px 700px at 50% 60%, #0b1220 0%, var(--bg0) 55%, #000 100%);
    }
    #stage{ position:fixed; inset:0; z-index:0; }
    canvas{ display:block; width:100%; height:100%; }

    .fog{
      position:fixed; inset:-10%;
      z-index:1; pointer-events:none;
      background:
        radial-gradient(900px 420px at 50% 62%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%),
        linear-gradient(to top, rgba(255,255,255,.08), rgba(255,255,255,0) 45%);
      filter: blur(18px);
      opacity:0;
      animation: fogDrift 10s ease-in-out infinite;
      mix-blend-mode: screen;
    }
    @keyframes fogDrift{
      0%{ transform: translate3d(-1.5%, 0.5%, 0) scale(1.02); }
      50%{ transform: translate3d(1.5%, -0.5%, 0) scale(1.04); }
      100%{ transform: translate3d(-1.5%, 0.5%, 0) scale(1.02); }
    }

    .vignette{
      position:fixed; inset:0; z-index:2; pointer-events:none;
      background: radial-gradient(1200px 700px at 50% 60%, rgba(0,0,0,0) 40%, rgba(0,0,0,.75) 100%);
      opacity:.9;
    }

    .ui{
      position:fixed; inset:0; z-index:4;
      display:grid;
      grid-template-columns: 1fr minmax(280px, 460px);
      align-items:center;
      padding: clamp(16px, 4vw, 48px);
      gap: clamp(16px, 3vw, 40px);
      pointer-events:none;
      opacity:0;
      transform: translateY(8px);
    }
    .copy{
      justify-self:end;
      width: min(460px, 92vw);
      padding: clamp(16px, 2.2vw, 24px);
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10);
      backdrop-filter: blur(12px);
      pointer-events:auto;
    }
    .kicker{
      font-size: 12px;
      letter-spacing:.26em;
      text-transform: uppercase;
      color: rgba(233,238,247,.55);
      margin: 0 0 10px 0;
    }
    h1{
      font-size: clamp(34px, 4vw, 56px);
      line-height:1.02;
      margin:0 0 10px 0;
      font-weight: 750;
    }
    h1 span{ font-weight: 420; color: rgba(233,238,247,.78); }
    .desc{
      margin: 0 0 18px 0;
      color: var(--muted);
      font-size: clamp(13px, 1.35vw, 16px);
      line-height: 1.5;
    }
    .actions{ display:flex; gap:12px; align-items:center; }
    .btn{
      border:none; cursor:pointer;
      padding: 12px 18px; border-radius: 12px;
      background: rgba(255,255,255,.88);
      color:#0a0f18;
      font-weight: 650;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
    }
    .btn:hover{ transform: translateY(-1px) scale(1.01); box-shadow: 0 18px 44px rgba(0,0,0,.45); filter: brightness(1.05); }
    .hint{ font-size:12px; color: rgba(233,238,247,.45); user-select:none; }

    .rig{ position:fixed; inset:0; z-index:4; pointer-events:none; }
    .spot{
      position:absolute;
      bottom: clamp(18px, 5vh, 52px);
      width: clamp(120px, 16vw, 220px);
      height: clamp(120px, 16vw, 220px);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 30px 80px rgba(0,0,0,.5);
      backdrop-filter: blur(10px);
      opacity:0;
      transform: translateY(10px);
    }
    .spot:after{
      content:"";
      position:absolute; left:50%; top:-120%;
      width:120%; height:240%;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(255,255,255,.22), rgba(255,255,255,0) 70%);
      filter: blur(18px);
      opacity:.55;
      mix-blend-mode: screen;
      animation: beamPulse 2.8s ease-in-out infinite;
    }
    @keyframes beamPulse{
      0%,100%{ opacity:.35; transform: translateX(-50%) scale(1); }
      50%{ opacity:.65; transform: translateX(-50%) scale(1.03); }
    }
    .spot.left{ left: clamp(10px, 3vw, 40px); }
    .spot.right{ right: clamp(10px, 3vw, 40px); }

    @media (max-width: 900px){
      .ui{ grid-template-columns: 1fr; align-items:end; }
      .copy{ justify-self:center; margin-bottom: clamp(10px, 2vh, 24px); }
      .spot{ opacity:0; }
    }

    .fallback{
      position:fixed; inset:0; z-index:10;
      display:none; place-items:center;
      padding:24px; text-align:center;
      background: radial-gradient(900px 500px at 50% 60%, #101a2b, #000);
    }
    .fallback > div{
      max-width:540px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      border-radius: 18px;
      padding: 18px;
    }
    .fallback p{ color: rgba(233,238,247,.65); margin:8px 0 0 0; }
  </style>
</head>

<body>
  <div id="stage"></div>
  <div class="fog" id="fog"></div>
  <div class="vignette"></div>

  <div class="rig" aria-hidden="true">
    <div class="spot left"></div>
    <div class="spot right"></div>
  </div>

  <div class="ui" id="ui">
    <div></div>
    <section class="copy">
      <p class="kicker">CINEMATIC DROP</p>
      <h1>Luxury <span>product</span></h1>
      <p class="desc">
        Reveal studio sombre, faisceaux de lumière, brume et métal.
        Ta pièce 3D apparaît sur le podium.
      </p>
      <div class="actions">
        <button class="btn" id="shop">Shop Now</button>
        <span class="hint">Bouge la souris / touche l’écran</span>
      </div>
    </section>
  </div>

  <div class="fallback" id="fallback">
    <div>
      <h2 style="margin:0 0 6px 0;">WebGL indisponible</h2>
      <p>Ton navigateur ne supporte pas WebGL. Essaie un navigateur récent.</p>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

    const stage = document.getElementById("stage");
    const ui = document.getElementById("ui");
    const fogEl = document.getElementById("fog");
    const fallback = document.getElementById("fallback");

    // Chemin GitHub Pages-safe: relatif au fichier HTML
    const MODEL_URL = "./piece_1/piece_1.gltf";

    function webglAvailable(){
      try{
        const c = document.createElement("canvas");
        return !!(window.WebGLRenderingContext &&
          (c.getContext("webgl") || c.getContext("experimental-webgl")));
      }catch(e){ return false; }
    }
    if(!webglAvailable()){
      fallback.style.display = "grid";
      throw new Error("WebGL not available");
    }

    // Scene
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0f18, 0.065);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:"high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    // Camera
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.25, 6.2);

    // Group (podium + objet)
    const rig = new THREE.Group();
    scene.add(rig);

    // Podium métallique (3 niveaux)
    function makePodium(){
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        color: 0x0c1018,
        metalness: 0.95,
        roughness: 0.25
      });

      const ring = (r, h, y) => {
        const geo = new THREE.CylinderGeometry(r, r, h, 96, 1, false);
        const m = new THREE.Mesh(geo, mat);
        m.position.y = y;
        m.castShadow = true;
        m.receiveShadow = true;

        const edge = new THREE.Mesh(
          new THREE.TorusGeometry(r, 0.015, 10, 160),
          new THREE.MeshStandardMaterial({ color:0xffffff, metalness:1, roughness:0.08, emissive:0x111111 })
        );
        edge.rotation.x = Math.PI/2;
        edge.position.y = y + h/2 - 0.02;
        edge.castShadow = false;
        edge.receiveShadow = false;

        g.add(m, edge);
      };

      ring(1.35, 0.28, 0.14);
      ring(1.05, 0.22, 0.38);
      ring(0.78, 0.18, 0.57);

      return g;
    }
    const podium = makePodium();
    rig.add(podium);

    // Sol glossy
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(7.5, 128),
      new THREE.MeshStandardMaterial({ color: 0x070a10, metalness:0.9, roughness:0.35 })
    );
    floor.rotation.x = -Math.PI/2;
    floor.position.y = -0.01;
    floor.receiveShadow = true;
    scene.add(floor);

    // Lumières (projecteurs mis en avant)
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const ambient = new THREE.AmbientLight(0xffffff, 0.10);
    scene.add(ambient);

    const leftSpot = new THREE.SpotLight(0xffffff, 0.0, 30, Math.PI/7, 0.35, 1.25);
    leftSpot.position.set(-3.6, 2.4, 2.8);
    leftSpot.target = podium;
    leftSpot.castShadow = true;
    leftSpot.shadow.mapSize.set(1024,1024);
    scene.add(leftSpot, leftSpot.target);

    const rightSpot = new THREE.SpotLight(0xffffff, 0.0, 30, Math.PI/7, 0.35, 1.25);
    rightSpot.position.set(3.6, 2.4, 2.8);
    rightSpot.target = podium;
    rightSpot.castShadow = true;
    rightSpot.shadow.mapSize.set(1024,1024);
    scene.add(rightSpot, rightSpot.target);

    const backRim = new THREE.DirectionalLight(0xffffff, 0.0);
    backRim.position.set(0, 3.2, -3.5);
    scene.add(backRim);

    // Dust particles
    const dustCount = 1200;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(dustCount * 3);
    for(let i=0;i<dustCount;i++){
      dustPos[i*3+0] = (Math.random()-0.5)*10;
      dustPos[i*3+1] = Math.random()*4.2;
      dustPos[i*3+2] = (Math.random()-0.5)*10;
    }
    dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({ color:0xffffff, size:0.012, transparent:true, opacity:0.20, depthWrite:false });
    const dust = new THREE.Points(dustGeo, dustMat);
    scene.add(dust);

    // Charger GLTF
    let model = null;
    const loader = new GLTFLoader();
    loader.load(
      MODEL_URL,
      (gltf) => {
        model = gltf.scene;
        model.traverse((o)=>{
          if(o.isMesh){
            o.castShadow = true;
            o.receiveShadow = true;
            if(o.material){
              o.material.metalness = Math.min(1, (o.material.metalness ?? 0.3) + 0.2);
              o.material.roughness = Math.max(0.15, (o.material.roughness ?? 0.6) - 0.15);
            }
          }
        });

        // Centrage & scale auto
        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);
        model.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        const target = 1.15; // hauteur "présentoir"
        const s = target / (maxDim || 1);
        model.scale.setScalar(s);

        model.position.y = 0.78; // au-dessus du podium
        rig.add(model);
      },
      undefined,
      (err) => {
        console.error("Erreur chargement GLTF:", err);
      }
    );

    // Intro cinématique (dolly + fade + montée des spots)
    const start = performance.now();
    const intro = { duration: 2400 };

    // Pointer interaction
    const pointer = { x:0, y:0, tx:0, ty:0 };
    const onMove = (x,y)=>{
      pointer.tx = (x / window.innerWidth) * 2 - 1;
      pointer.ty = (y / window.innerHeight) * 2 - 1;
    };
    window.addEventListener("mousemove", (e)=> onMove(e.clientX, e.clientY), { passive:true });
    window.addEventListener("touchmove", (e)=>{
      if(!e.touches?.length) return;
      onMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive:true });

    // Bouton demo
    document.getElementById("shop").addEventListener("click", ()=>{
      // placeholder : tu brancheras plus tard
      alert("CTA: Shop Now (à brancher)");
    });

    function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
    function clamp01(t){ return Math.max(0, Math.min(1, t)); }

    function resize(){
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }
    window.addEventListener("resize", resize);

    function animate(now){
      const t = clamp01((now - start) / intro.duration);
      const e = easeOutCubic(t);

      // Intro caméra (dolly in)
      camera.position.z = 7.4 - 1.2 * e;
      camera.position.y = 1.35 - 0.10 * e;
      camera.lookAt(0, 0.85, 0);

      // Fade UI + fog + spots
      ui.style.opacity = (e).toFixed(3);
      ui.style.transform = `translateY(${(10*(1-e)).toFixed(2)}px)`;
      fogEl.style.opacity = (0.60 * e).toFixed(3);

      // Monter intensité des projecteurs
      leftSpot.intensity = 9.5 * e;
      rightSpot.intensity = 9.5 * e;
      backRim.intensity = 1.2 * e;

      // Révéler les “projecteurs” UI
      const spots = document.querySelectorAll(".spot");
      spots.forEach((sEl)=>{
        sEl.style.opacity = (0.85 * e).toFixed(3);
        sEl.style.transform = `translateY(${(10*(1-e)).toFixed(2)}px)`;
      });

      // Lissage pointer
      pointer.x += (pointer.tx - pointer.x) * 0.06;
      pointer.y += (pointer.ty - pointer.y) * 0.06;

      // Tilt doux
      const tiltX = pointer.y * 0.12;
      const tiltY = pointer.x * 0.22;
      rig.rotation.x = tiltX;
      rig.rotation.y = tiltY;

      // Variation des spots (hover-like)
      const pulse = 0.9 + (Math.abs(pointer.x) + Math.abs(pointer.y)) * 0.08;
      leftSpot.intensity *= pulse;
      rightSpot.intensity *= pulse;

      // Rotation lente de la pièce
      if(model){
        model.rotation.y += 0.0055;
      }

      // Dust drift
      dust.rotation.y += 0.0009;
      dust.rotation.x += 0.0003;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
